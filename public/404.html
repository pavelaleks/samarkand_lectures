<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages редирект для SPA
      var path = window.location.pathname;
      var basePath = '/samarkand_lectures';
      
      // Убираем basePath из начала пути
      if (path.startsWith(basePath + '/')) {
        path = path.substring(basePath.length);
      } else if (path === basePath || path === basePath + '/') {
        path = '/';
      }
      
      // Если путь не начинается с /, добавляем его
      if (!path.startsWith('/')) {
        path = '/' + path;
      }
      
      // Если путь заканчивается на .html, .css, .js и т.д. - не редиректим
      if (path.match(/\.(html|css|js|json|pdf|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$/i)) {
        // Это статический файл, не редиректим
        return;
      }
      
      // Редиректим на index.html, сохраняя путь
      // React Router обработает путь через basename
      var redirectUrl = basePath + '/index.html';
      
      // Просто загружаем index.html - React Router сам разберется с путем через basename
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
    <script>
      // Fallback на случай если JavaScript не сработал
      setTimeout(function() {
        window.location.href = '/samarkand_lectures/';
      }, 1000);
    </script>
  </body>
</html>
